  <script>
    /* Early image fallback (WebP -> JPEG -> hide) so above-the-fold images
       degrade gracefully even before the main script runs. Redefined with
       full placeholder support in the main script below. */
    function imgFail(el) {
      if (!el.dataset.fb && el.dataset.jpg) { el.dataset.fb = '1'; el.src = el.dataset.jpg; }
      else { el.onerror = null; el.style.visibility = 'hidden'; }
    }
  </script>

  <style>
    /* ---------- Base (works even if the Tailwind CDN is unreachable) ---------- */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      background-color: #171514;
      color: #FDFBF7;
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ---------- Slider core ---------- */
    #sliderViewport {
      touch-action: pan-y; /* horizontal drags drive the slider, vertical scroll stays native */
      cursor: grab;
    }
    #sliderViewport.dragging { cursor: grabbing; }
    #sliderViewport img { -webkit-user-drag: none; user-select: none; }
    .slide-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    .slide-track.no-anim { transition: none; }
    .pizza-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      position: relative;
      min-width: 0;
    }
    @media (max-width: 1023px) {
      /* Let tall content scroll inside the slide instead of overflowing the viewport */
      .pizza-slide { overflow-y: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      .slide-track { transition-duration: 0.01ms; }
      .hero-pizza-spin { animation: none !important; }
    }

    /* ---------- Hero pizza glow & float ---------- */
    .hero-pizza-glow {
      filter: drop-shadow(0 25px 50px rgba(0, 0, 0, 0.75));
    }
    .hero-pizza-spin {
      animation: gentleFloat 8s ease-in-out infinite alternate;
    }
    @keyframes gentleFloat {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      100% { transform: translateY(-8px) rotate(1.5deg) scale(1.015); }
    }

    /* ---------- Mobile-first QR refinements ---------- */
    .safe-top { padding-top: max(1rem, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
    /* Float animation runs only on the visible slide (battery + perf) */
    .pizza-slide .hero-pizza-spin { animation: none; }
    .pizza-slide.active .hero-pizza-spin { animation: gentleFloat 8s ease-in-out infinite alternate; }
    /* App shell pinned to the viewport so the bottom nav always sticks.
       Layout is defined here in plain CSS (not only Tailwind utilities) so
       the footer stays glued to the bottom even if the CDN is unreachable
       or slide content runs tall. */
    .interactive-ui {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    #sliderViewport {
      flex: 1 1 auto;
      min-height: 0; /* lets the slide area shrink so the footer never gets pushed off */
      min-width: 0;
      overflow: hidden;
      position: relative;
    }
    .interactive-ui footer {
      flex-shrink: 0; /* footer keeps its height, always visible at the bottom */
    }
    /* Menu is non-interactive until a language is chosen on first visit. */
    body.locked .interactive-ui { pointer-events: none; }
    body.locked .interactive-ui .pizza-slide { user-select: none; }

    /* ---------- First-visit language modal ---------- */
    .lang-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(10, 9, 8, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .lang-modal.open { display: flex; }
    .lang-card {
      width: min(420px, 100%);
      background: #211E1C;
      border: 1px solid rgba(217, 165, 102, 0.35);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      animation: langPop 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes langPop {
      0% { opacity: 0; transform: translateY(14px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .lang-logo {
      width: 84px;
      height: 84px;
      border-radius: 9999px;
      object-fit: cover;
      border: 2px solid rgba(217, 165, 102, 0.6);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      margin: 0 auto 12px auto;
      display: block;
      background: #2A2725;
    }
    .lang-btn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }
    .lang-btn:active { transform: scale(0.97); }
    @media (prefers-reduced-motion: reduce) {
      .lang-card { animation: none; }
    }
    /* Dots hide on very narrow screens so counter + buttons always fit. */
    @media (max-width: 379px) {

    }

    /* ---------- Mild swipe hint (dismisses on first slide change) ---------- */
    .swipe-hint {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: rgba(42, 39, 37, 0.85);
      border: 1px solid rgba(217, 165, 102, 0.4);
      color: #FDFBF7;
      font-size: 12px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none; /* never blocks dragging */
      transition: opacity 0.5s ease;
    }
    .swipe-hint.show { opacity: 1; }
    .swipe-hint .swipe-arrows {

      color: #D9A566;
    }

      0%, 100% { transform: translateX(-4px); }

    }
    @media (prefers-reduced-motion: reduce) {

    function inr(n) { return '₹' + n; } /* Indian rupee formatting in one place */
    function pad2(n) { return String(n).padStart(2, '0'); }
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* WebP first, local JPEG fallback, inline placeholder as last resort. */
    function imgFail(el) {
      if (!el.dataset.fb && el.dataset.jpg) { el.dataset.fb = '1'; el.src = el.dataset.jpg; }
      else { el.onerror = null; el.src = FALLBACK_IMG; }
    }
    function photoImg(p, opts) {
      var load = opts.eager ? ' loading="eager" fetchpriority="high"' : ' loading="lazy"';
      return '<img src="' + p.image + '" data-jpg="' + p.jpg + '" width="' + p.w + '" height="' + p.h + '"' +
        ' alt="' + esc(opts.alt) + '" draggable="false" decoding="async"' + load +
        ' class="' + opts.cls + '" onerror="imgFail(this)">';
    }

    /* Active language ('en' default) + centralized UI strings. Pizza-level
       Hindi lives on each MENU record; everything else lives here. */
    var lang = 'en';
    var menuOpen = false;
    var STR = {
      en: {
        sizesTitle: 'Available Sizes & Pricing',
        ingredients: 'Prime Ingredients',
        popular: 'Popular',
        hint: 'Use ← → or Swipe',
        prev: 'Previous Pizza',
        next: 'Next Pizza',
        dotsLabel: 'Pizza slides',
        sizes: ['Regular (10")', 'Medium (12")', 'Large (14")'],
        langName: 'हिंदी',
        langAria: 'Switch language to Hindi',
        swipeHint: 'Swipe to explore'
      },
      hi: {
        sizesTitle: 'साइज़ और कीमतें',
        ingredients: 'मुख्य सामग्री',
        popular: 'लोकप्रिय',
        hint: '← → दबाएँ या स्वाइप करें',
        prev: 'पिछला पिज़्ज़ा',
        next: 'अगला पिज़्ज़ा',
        dotsLabel: 'पिज़्ज़ा स्लाइड',
        sizes: ['रेगुलर (10")', 'मीडियम (12")', 'लार्ज (14")'],
        langName: 'English',
        langAria: 'Switch language to English',
        swipeHint: 'स्वाइप करके देखें'
      }
    };
    function T(key) { return STR[lang][key]; }
    /* Language-aware pizza fields: names stay original, the rest translates. */
    function P(p, field) {
      var hf = p[field + '_hi'];
      return (lang === 'hi' && hf) ? hf : p[field];
    }
    function dotAria(p) {
      return lang === 'hi' ? p.name + ' देखें' : 'Show ' + p.name;
    }

    /* ---------- Render the interactive slider from MENU (in `lang`) ---------- */
    function slideHTML(p, i) {
      var list = P(p, 'ingredients');
      var chips = list.map(function (g) {
        return '<span class="px-2.5 py-1 bg-white/5 border border-white/10 rounded-lg text-xs text-white/80">' + esc(g) + '</span>';
      }).join('');
      var cards = p.sizes.map(function (s, si) {
        var hot = si === 1; /* Medium highlighted as popular, matches original design */
        return '' +
          '<div class="' + (hot ? 'bg-black/40 border border-terracotta/40' : 'bg-black/30 border border-white/5') + ' rounded-xl p-2.5 sm:p-3 text-center relative overflow-hidden">' +
            (hot ? '<span class="absolute top-1 -right-5 bg-terracotta text-[9px] text-white px-5 py-px rotate-[24deg] uppercase font-bold tracking-wide">' + esc(T('popular')) + '</span>' : '') +
            '<span class="block text-[11px] sm:text-xs ' + (hot ? 'text-white/90' : 'text-white/60') + ' font-medium">' + esc(T('sizes')[si]) + '</span>' +
            '<span class="font-serif text-base sm:text-xl font-bold ' + (hot ? 'text-white' : 'text-crust') + ' mt-0.5 block">' + inr(s.price) + '</span>' +
          '</div>';
      }).join('');
      return '' +
        '<div class="pizza-slide flex items-center justify-center p-4 sm:p-6 md:p-12" data-index="' + i + '" role="tabpanel" aria-label="' + esc(p.name) + '">' +
          '<div class="max-w-7xl w-full h-full flex flex-col lg:flex-row items-center justify-center gap-4 sm:gap-6 lg:gap-14">' +
            '<div class="w-full lg:w-1/2 flex items-center justify-center max-h-[44vh] sm:max-h-[48vh] lg:max-h-[75vh]">' +
              '<div class="relative w-full max-w-[320px] sm:max-w-[420px] lg:max-w-[560px] aspect-square rounded-full p-2 bg-gradient-to-tr from-white/5 to-white/0 border border-white/10 flex items-center justify-center shadow-2xl">' +
                photoImg(p, { alt: p.name + ' Pizza', eager: i === 0, cls: 'w-[94%] h-[94%] object-cover rounded-full hero-pizza-glow hero-pizza-spin pointer-events-none' }) +
                '<div class="absolute top-2 right-4 sm:top-6 sm:right-6 ' + p.badgeClass + ' font-serif italic text-xs md:text-sm px-3.5 py-1.5 rounded-full shadow-lg">' + esc(P(p, 'badge')) + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="w-full lg:w-1/2 flex flex-col justify-center space-y-4 md:space-y-6 text-left">' +
              '<div>' +
                '<div class="' + p.kickerClass + ' font-semibold text-xs tracking-widest uppercase mb-1">' + esc(pad2(i + 1) + ' • ' + P(p, 'category')) + '</div>' +
                '<h1 class="font-serif text-[1.7rem] sm:text-4xl lg:text-5xl xl:text-6xl font-bold tracking-tight text-parchment leading-tight">' + esc(p.name) + '</h1>' +
                '<p class="text-white/70 text-sm sm:text-base md:text-lg mt-2 max-w-xl font-light leading-relaxed">' + esc(P(p, 'description')) + '</p>' +
              '</div>' +
              '<div class="bg-charcoalLight/70 border border-white/10 rounded-2xl p-3.5 sm:p-5 backdrop-blur-sm">' +
                '<div class="text-[11px] uppercase tracking-wider text-white/40 font-semibold mb-2.5">' + esc(T('sizesTitle')) + '</div>' +
                '<div class="grid grid-cols-3 gap-2.5 sm:gap-4">' + cards + '</div>' +
              '</div>' +
              '<div>' +
                '<span class="text-[11px] uppercase tracking-wider text-white/40 font-semibold block mb-2">' + esc(T('ingredients')) + '</span>' +
                '<div class="flex flex-wrap gap-1.5 sm:gap-2">' + chips + '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    /* ---------- State + rendering ---------- */
    var currentSlide = 0;
    var totalSlides = MENU.length;
    var track = document.getElementById('slideTrack');
    var counter = document.getElementById('slideCounter');
    var indicatorDots = document.getElementById('indicatorDots');
    var viewport = document.getElementById('sliderViewport');

    track.innerHTML = MENU.map(slideHTML).join('');

    /* Preload menu images after first paint so swiping feels instant. */
    function preloadImages() {
      MENU.forEach(function (p) {
        var im = new Image();
        im.src = p.image;
      });
      var logo = new Image();
      logo.src = 'assets/images/logo.webp';
    }
    /* Defer bulk preload until the first screen is interactive (QR/mobile-data friendly). */
    if ('requestIdleCallback' in window) {
      requestIdleCallback(function () { preloadImages(); }, { timeout: 3000 });
    } else if (document.readyState === 'complete') {
      preloadImages();
    } else {
      window.addEventListener('load', preloadImages);
    }

    /* ---------- Swipe hint: shows once the menu opens, hides forever
       (for this visit) on the first slide change or after 7 seconds ---------- */
    var hintVisible = false, hintSlide = 0, hintTimer = null;
    function showSwipeHint() {
      if (hintVisible) return;
      hintVisible = true;
      hintSlide = currentSlide;
      document.getElementById('swipeHint').classList.add('show');
      hintTimer = setTimeout(hideSwipeHint, 7000);
    }
    function hideSwipeHint() {
      if (!hintVisible) return;
      hintVisible = false;
      if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
      document.getElementById('swipeHint').classList.remove('show');
    }

    /* ---------- Slide navigation ---------- */
    function updateSlide() {
      track.style.transform = 'translateX(-' + (currentSlide * 100) + '%)';
      if (hintVisible && currentSlide !== hintSlide) hideSwipeHint();
      var slides = track.children;
      for (var s = 0; s < slides.length; s++) {
        if (slides[s].classList) slides[s].classList.toggle('active', s === currentSlide);
      }
      counter.innerHTML = pad2(currentSlide + 1) + ' <span class="text-white/30 text-sm sm:text-base font-sans font-light">/ ' + pad2(totalSlides) + '</span>';
      var dots = indicatorDots.querySelectorAll('button');
      for (var d = 0; d < dots.length; d++) {
        dots[d].className = (d === currentSlide)
          ? 'w-8 h-1.5 rounded-full bg-terracotta transition-all'
          : 'w-2.5 h-1.5 rounded-full bg-white/20 hover:bg-white/40 transition-all';
        dots[d].setAttribute('aria-selected', d === currentSlide ? 'true' : 'false');
        dots[d].setAttribute('aria-label', dotAria(MENU[d]));
      }
    }

    function goToSlide(index) {
      if (typeof index !== 'number' || isNaN(index)) return;
      currentSlide = ((Math.round(index) % totalSlides) + totalSlides) % totalSlides;
      updateSlide();
    }
    function nextSlide() { goToSlide(currentSlide + 1); }
    function prevSlide() { goToSlide(currentSlide - 1); }

    /* Progress dots built from the same data (always visible, all viewports). */
    MENU.forEach(function (p, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-label', dotAria(p));
      b.addEventListener('click', function () { goToSlide(i); });
      indicatorDots.appendChild(b);
    });
    updateSlide();

    /* ---------- Keyboard: arrows only, never hijack form controls ---------- */
    window.addEventListener('keydown', function (e) {
      var t = e.target;
      if (t && t.closest && t.closest('button, input, textarea, select, [contenteditable="true"]')) return;
      if (!menuOpen) return; /* modal owns the keyboard until a language is chosen */
      if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
      else if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); nextSlide(); }
    });

    function viewportWidth() { return viewport.clientWidth || window.innerWidth || 1; }
    function swipeThreshold() { return Math.min(90, viewportWidth() * 0.12); }

    /* Shared finish: navigate past the threshold, else snap back. */
    function finishSwipe(dx, moved) {
      track.classList.remove('no-anim');
      viewport.classList.remove('dragging');
      var threshold = swipeThreshold();
      if (dx <= -threshold) nextSlide();
      else if (dx >= threshold) prevSlide();
      else updateSlide(); /* snap back */
      if (moved) {
        /* Swallow the tap/click that follows a real swipe. */
        var swallow = function (ev) { ev.stopPropagation(); ev.preventDefault(); };
        viewport.addEventListener('click', swallow, true);
        setTimeout(function () { viewport.removeEventListener('click', swallow, true); }, 80);
      }
    }

    /* ---------- Touch swipe (primary mobile path — works even in old
       QR-scanner WebViews without Pointer Events). Directional lock keeps
       vertical scrolling native; only locked horizontal moves are claimed. */
    var tsy = { active: false, id: null, x0: 0, y0: 0, dx: 0, lock: null, moved: false };

    viewport.addEventListener('touchstart', function (e) {
      if (!menuOpen) { tsy.active = false; return; }
      if (e.touches.length !== 1) { tsy.active = false; return; }
      var t = e.touches[0];
      tsy.active = true; tsy.id = t.identifier;
      tsy.x0 = t.clientX; tsy.y0 = t.clientY;
      tsy.dx = 0; tsy.lock = null; tsy.moved = false;
      track.classList.add('no-anim');
    }, { passive: true });

    viewport.addEventListener('touchmove', function (e) {
      if (!tsy.active) return;
      var t = null;
      for (var k = 0; k < e.changedTouches.length; k++) {
        if (e.changedTouches[k].identifier === tsy.id) t = e.changedTouches[k];
      }
      if (!t) return;
      var dx = t.clientX - tsy.x0;
      var dy = t.clientY - tsy.y0;
      if (tsy.lock === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
        tsy.lock = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
      }
      if (tsy.lock !== 'h') return; /* vertical scroll stays native */
      if (e.cancelable) e.preventDefault();
      tsy.dx = dx;
      if (Math.abs(dx) > 6) tsy.moved = true;
      var base = -(currentSlide * viewportWidth());
      track.style.transform = 'translateX(' + (base + dx) + 'px)';
    }, { passive: false });

    function endTouch(e) {
      if (!tsy.active) return;
      tsy.active = false;
      finishSwipe(tsy.dx, tsy.moved);
      tsy.dx = 0; tsy.id = null;
    }
    viewport.addEventListener('touchend', endTouch);
    viewport.addEventListener('touchcancel', endTouch);

    /* ---------- Mouse drag (desktop). Gated to mouse so touch devices
       never double-handle a gesture through both paths. ---------- */
    var drag = { active: false, startX: 0, dx: 0, moved: false };

    viewport.addEventListener('pointerdown', function (e) {
      if (!menuOpen) return;
      if (e.pointerType && e.pointerType !== 'mouse') return;
      if (e.pointerType === undefined && e.pointerId === undefined && 'ontouchstart' in window) return;
      if (e.button !== undefined && e.button !== 0) return;
      drag.active = true;
      drag.startX = e.clientX;
      drag.dx = 0;
      drag.moved = false;
      track.classList.add('no-anim');
      viewport.classList.add('dragging');
    });

    viewport.addEventListener('pointermove', function (e) {
      if (!drag.active) return;
      if (e.pointerType && e.pointerType !== 'mouse') return;
      drag.dx = e.clientX - drag.startX;
      if (Math.abs(drag.dx) > 6) drag.moved = true;
      var base = -(currentSlide * viewportWidth());
      track.style.transform = 'translateX(' + (base + drag.dx) + 'px)';
    });

    function endMouseDrag(e) {
      if (!drag.active) return;
      drag.active = false;
      finishSwipe(drag.dx, drag.moved && e && e.type === 'pointerup');
      drag.dx = 0;
    }
    viewport.addEventListener('pointerup', endMouseDrag);
    viewport.addEventListener('pointercancel', endMouseDrag);
    viewport.addEventListener('dragstart', function (e) { e.preventDefault(); });

    /* ---------- Language system: select + render (no storage — the
       modal shows on every visit) ---------- */
    /* Re-render everything in `lang` without touching currentSlide. */
    function renderAll() {
      document.documentElement.lang = lang;
      track.innerHTML = MENU.map(slideHTML).join('');
      document.getElementById('kbdHint').textContent = T('hint');
      document.getElementById('prevBtn').setAttribute('aria-label', T('prev'));
      document.getElementById('nextBtn').setAttribute('aria-label', T('next'));
      var langBtn = document.getElementById('langBtn');
      langBtn.textContent = T('langName');
      langBtn.setAttribute('aria-label', T('langAria'));
      document.getElementById('swipeHintText').textContent = T('swipeHint');
      indicatorDots.setAttribute('aria-label', T('dotsLabel'));
      updateSlide();
    }

    function setLanguage(L) {
      lang = (L === 'hi') ? 'hi' : 'en';
      renderAll();
    }
    function toggleLang() {
      setLanguage(lang === 'en' ? 'hi' : 'en');
    }

    function openModal() {
      menuOpen = false;
      document.body.classList.add('locked');
      document.getElementById('langModal').classList.add('open');
    }
    function closeModal() {
      menuOpen = true;
      document.body.classList.remove('locked');
      document.getElementById('langModal').classList.remove('open');
      showSwipeHint();
    }
    function chooseLanguage(L) {
      setLanguage(L);
      closeModal();
      tryFullscreen(); /* modal tap is a real gesture, so phones can go true fullscreen */
    }

    /* Best-effort fullscreen for QR opens (Android Chrome hides browser UI;
       iOS Safari ignores it — both fail silently by design). */
    function tryFullscreen() {
      try {
        var el = document.documentElement;
        if (el.requestFullscreen) {
          var r = el.requestFullscreen();
          if (r && r.catch) r.catch(function () {});
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
      } catch (e) {}
    }

    /* ---------- Boot: always start with the language modal ---------- */
    (function boot() {
      lang = 'en';
      renderAll();
      openModal();
    })();
  </script>

</body>
</html>
